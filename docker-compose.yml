name: 'vendure-api'
services:
    mysql_db:
        image: mysql:8
        volumes:
            - mysql_db_data:/var/lib/mysql
        environment:
            MYSQL_ROOT_PASSWORD: 'ROOT'
            MYSQL_DATABASE: vendure
            MYSQL_USER: vendure
            MYSQL_PASSWORD: vendure
        ports:
            - "4306:3306"
        labels:
            - "io.vendure.create.name=vendure-api"

volumes:
    mysql_db_data:
        driver: local
        labels:
            - "io.vendure.create.name=vendure-api"